name: Daily Rice Price Checker

on:
  schedule:
    # 매일 한국시간 오전 8시 실행 (UTC 기준 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 버튼 눌러서 직접 실행해볼 수 있는 옵션

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install requests beautifulsoup4

      - name: 가격 확인 및 텔레그램 전송
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
